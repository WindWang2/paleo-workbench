name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Full monorepo suite — required product gate (see docs/ci-merge-policy.md).
  # The suite must be green without quarantine; no continue-on-error.
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The 3.13 legs exist to OBSERVE the #951 SIGSEGV (3.13-only, crash under
    # pytestqt _process_events, semi-deterministic ~mid-suite; 3.12 is fully
    # green on identical code). They are diagnostics, not product gates: a
    # crashing diagnostic must not block every merge until #951 is root-caused
    # (that would freeze the repo). Results stay visible on each run.
    continue-on-error: ${{ matrix.python-version == '3.13' }}
    # pyproject (and the geoviz/native subpackages) pin requires-python to
    # >=3.12,<3.13 by policy (cp312/cp313 .so shadowing, #435/#851), but the
    # 3.13 legs below are deliberate #951 diagnostics: bypass the metadata
    # gate for every pip invocation in this job instead of flagging each
    # install line. Harmless on the 3.12 legs (all pins already satisfied).
    env:
      PIP_IGNORE_REQUIRES_PYTHON: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.13"
            qt-media-backend: "ffmpeg"

    steps:
      # Split checkout by OS: Windows runner hits MAX_PATH on third_party/gdal's deep
      # sentinel2 fixtures (autotest/gdrivers/data/... >260 chars) — fatal for
      # actions/checkout's recursive init. The Windows python leg does not need
      # vendored GDAL (seismic chunked path / fallback renderers cover it), so
      # fetch only the geo-viz-engine (+ well-log-engine) submodules there.
      # Linux keeps the full recursive graph for the vendored GDAL build.
      - name: Checkout (Linux)
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout (Windows)
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git submodule update --init geo-viz-engine well-log-engine
          echo "Windows checkout: geo-viz-engine + well-log-engine only (skip third_party/gdal long paths)" 

      - name: Guard against Windows-invalid submodule filenames
        # Packaging #441 (resolved upstream): the geo-viz-engine rename landed
        # and the pinned tree is Windows-checkout-clean (verified by the local
        # twin of this scan, tests/test_workflow_integrity.py). This guard
        # stays as the fail-closed tripwire: re-pinning a submodule that ships
        # Windows-invalid paths fails this step instead of breaking recursive
        # checkouts on Windows silently.
        shell: bash
        run: |
          python - <<'EOF'
          import pathlib, sys
          INVALID = set('<>:"|?*')
          RESERVED = {"CON", "PRN", "AUX", "NUL",
                      "COM1", "COM2", "COM3", "COM4", "COM5", "COM6", "COM7", "COM8", "COM9",
                      "LPT1", "LPT2", "LPT3", "LPT4", "LPT5", "LPT6", "LPT7", "LPT8", "LPT9"}
          bad = []
          for path in pathlib.Path("geo-viz-engine").rglob("*"):
              for part in path.parts[1:]:
                  if any(c in INVALID or ord(c) < 32 for c in part):
                      bad.append(str(path))
                  elif part.split(".")[0].upper() in RESERVED:
                      bad.append(str(path))
          if bad:
              print("::error::Windows-invalid filenames in geo-viz-engine (packaging #441):")
              for p in bad:
                  print("::error::  " + p)
              sys.exit(1)
          print("geo-viz-engine tree: no Windows-invalid filenames")
          EOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System libraries (Qt / offscreen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            swig \
            libsqlite3-dev \
            libgl1 \
            libgl1-mesa-dri \
            mesa-utils \
            xvfb \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libegl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[dev,native]"
          # geo-viz-engine subpackages (may pull shapely, scipy, …). These
          # installs MUST fail closed (packaging #442): the previous `|| true`
          # best-effort silently shrank the tested surface (broken dependency
          # graphs surfaced only as scattered skips), and the hand-kept
          # eight-package fallback list had drifted from
          # requirements-geoviz.txt — geoviz_well_seismic_3d was missing.
          # requirements-geoviz.txt is the single source of truth.
          python -m pip install --prefer-binary -r requirements-geoviz.txt
          # Import smoke: prove the geoviz graph actually installed.
          python -c "import geoviz, geoviz_well_seismic_3d"
          python -m pip install shapely

      - name: Build vendored GDAL (+PROJ) from third_party sources
        # ADR 0060: GDAL is compiled from the third_party/gdal +
        # third_party/proj submodules into native/gdal-vendored — no system
        # libgdal, no pip gdal sdist, no version-mismatch class (#851).
        if: runner.os == 'Linux'
        run: |
          scripts/build_vendored_gdal.sh "$(command -v python)"
          # Fail closed if the bindings did not land.
          source native/gdal-vendored/install/env.sh
          python -c "from osgeo import gdal; assert gdal.__version__"

      - name: Build map_edit_core (required)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -e geo-viz-engine/native/map_edit_core
          python -c "from geoviz_plots.map_edit import HAS_CPP; assert HAS_CPP is True, 'HAS_CPP must be True in CI'"
          # __version__ on map_edit_core is added on the geo-viz-engine side
          # (packaging #435 cross-repo todo); only the source resolution check
          # applies here.
          python -c "import map_edit_core; assert 'native/map_edit_core' in map_edit_core.__file__, 'map_edit_core must resolve to the freshly built module, not a committed root binary'"

      - name: Build grid_render_core (required)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -e native/grid_render_core
          python -c "import grid_render_core; assert hasattr(grid_render_core, 'render_grid_rgba'), 'grid_render_core.render_grid_rgba missing in CI'"
          python -c "import grid_render_core; assert 'native/grid_render_core' in grid_render_core.__file__, 'grid_render_core must resolve to the freshly built module'; assert hasattr(grid_render_core, '__version__'), 'grid_render_core.__version__ missing in CI'"

      - name: Build layer_model_core (required)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -e native/layer_model_core
          python -c "import layer_model_core; assert hasattr(layer_model_core, 'LayerRegistry'), 'layer_model_core.LayerRegistry missing in CI'"

      - name: Build seismic_3d_core (required)
        if: runner.os == 'Linux'
        # Round-2 review (K-F1): these two extensions previously had NO CI
        # build step — the committed root binaries shadowed source on 3.13 and
        # skipped every native test on 3.12, so source-only changes shipped
        # untested. Packaging #435 removed the committed repo-root binaries
        # (sys.path[0] shadowing) and added native __version__ build metadata;
        # the __file__/__version__ asserts below now verify the import resolves
        # to the freshly built module, not a stale committed binary.
        run: |
          python -m pip install -e native/seismic_3d_core
          python -c "import seismic_3d_core; assert hasattr(seismic_3d_core, 'fast_slice_to_indexed8'), 'seismic_3d_core symbols missing in CI'"
          python -c "import seismic_3d_core; assert 'native/seismic_3d_core' in seismic_3d_core.__file__, 'seismic_3d_core must resolve to the freshly built module, not a committed root binary'; assert hasattr(seismic_3d_core, '__version__'), 'seismic_3d_core.__version__ missing in CI'"

      - name: Build well_log_core (required)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -e native/well_log_core
          python -c "import well_log_core; assert hasattr(well_log_core, 'fast_las_parse_data'), 'well_log_core symbols missing in CI'"
          python -c "import well_log_core; assert 'native/well_log_core' in well_log_core.__file__, 'well_log_core must resolve to the freshly built module, not a committed root binary'; assert hasattr(well_log_core, '__version__'), 'well_log_core.__version__ missing in CI'"

      - name: Native C++ selftests (algorithm verification)
        if: runner.os == 'Linux'
        run: |
          set -e
          g++ -std=c++17 -O2 -Wall -Wextra \
            native/grid_render_core/src/grid_render_core.cpp \
            native/grid_render_core/src/scalar_grid_layer.cpp \
            native/grid_render_core/src/standalone_test.cpp \
            -o /tmp/grid_render_selftest && /tmp/grid_render_selftest
          g++ -std=c++17 -O2 -Wall -Wextra \
            native/layer_model_core/src/layer_model.cpp \
            native/layer_model_core/src/standalone_test.cpp \
            -o /tmp/layer_model_selftest && /tmp/layer_model_selftest

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "3.3"
          MESA_GLSL_VERSION_OVERRIDE: "330"
          QT_OPENGL: software
          # #951 triage: QtMultimedia on headless runners may SIGSEGV in
          # QMediaPlayer teardown (pytest-qt _process_events → Qt event
          # dispatch use-after-free). Documented backends: ffmpeg,
          # gstreamer, windows, darwin, android (Qt 6.5+). "none" is
          # undocumented — if needed, set QT_MEDIA_BACKEND=none or empty
          # here and compare runs; ffmpeg is the explicit default forced
          # for the diagnostic variant.
          QT_MEDIA_BACKEND: ${{ matrix.qt-media-backend || '' }}
          PYTHONFAULTHANDLER: "1"
        run: |
          # Vendored GDAL env (GDAL_DATA/PROJ_DATA/LD_LIBRARY_PATH/PYTHONPATH).
          source native/gdal-vendored/install/env.sh
          # Per-test timeout (thread: better for pure-Python hangs; native still
          # may need the job-level ceiling). -v prints the last started test
          # when the suite dies so the hung case is identifiable in CI logs.
          # A green suite fits well inside the 60m job timeout (locally ~2m).
          xvfb-run -a python -m pytest -v --tb=line \
            --timeout=45 \
            --timeout-method=thread \
            -m "not slow and not welllog_binding" \
            --durations=25

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest -v --tb=line `
            --timeout=45 `
            --timeout-method=thread `
            -m "not slow and not welllog_binding" `
            --durations=25

      - name: Assert the slow family has not silently shrunk
        if: runner.os == 'Linux'
        # Packaging #442/#896: the fast gate deliberately deselects `slow` (the only
        # real-data end-to-end + interpolation-perf coverage). If the slow
        # family ever drops below its 15-test baseline (14 + 1 fence probe), every
        # environment silently stops running those gates — fail instead. The nightly
        # workflow (.github/workflows/slow-tests.yml) actually executes them.
        run: |
          count="$(python -m pytest --collect-only -q -m slow tests/ 2>&1 | grep -oE '[0-9]+ tests collected' | grep -oE '^[0-9]+')"
          echo "slow tests collected: ${count} (baseline 15)"
          test -n "${count}" && test "${count}" -ge 15

      - name: Assert the welllog binding contract still exists (#917)
        if: runner.os == 'Linux'
        # Audit #896/#917: the workbench↔engine binding contract needs a BUILT
        # welllog pybind module, which no CI leg installs — running it here made
        # the required gate permanently red. It is deselected above, but its
        # PRESENCE is asserted (baseline: 1 contract + 1 guard) so the contract
        # cannot silently vanish; execution happens where the binding is built.
        run: |
          count="$(python -m pytest --collect-only -q -m welllog_binding tests/ 2>&1 | grep -oE '[0-9]+ tests collected' | grep -oE '^[0-9]+')"
          echo "welllog_binding tests collected: ${count} (baseline 2)"
          test -n "${count}" && test "${count}" -ge 2

  # Focused job for Well Log Workstation (#207 / PR #233): no geo-viz submodule,
  # no map_edit_core. Host-only (engine optional) so the workstation suite is
  # isolated from the monorepo install (see docs/ci-merge-policy.md).
  well-log-workstation:
    name: Well Log Workstation (host)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Workstation tests live in the well-log-engine submodule; only that
          # submodule is fetched below. geo-viz-engine stays unchecked out.
          submodules: false

      - name: Fetch well-log-engine submodule (workstation tests live there)
        run: git submodule update --init well-log-engine

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System libraries (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libegl1 \
            libxcb-cursor0 \
            libfontconfig1 \
            libfreetype6

      - name: Install workstation test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26" \
            "PySide6==6.11.1" \
            "lasio>=0.31" \
            "pytest>=8" \
            "pytest-qt>=4" \
            "pytest-timeout>=2.3"

      - name: Run well_log_workstation tests
        env:
          QT_QPA_PLATFORM: offscreen
          WLWS_DISABLE_ENGINE: "1"
          PYTHONPATH: ${{ github.workspace }}/well-log-engine/apps/wellplot-desktop:${{ github.workspace }}
        run: |
          # Host-only job: the engine bindings are not installed, so skip the
          # binding-contract test (hard module-level `import welllog`). All
          # other engine-optional tests self-skip via _native_importable().
          # (--ignore would not apply here: the shell expands the glob into
          # explicit file args, which bypass --ignore.)
          # Round-2 review (K-F3): the positive `find -name` selection silently
          # excluded 17 workstation modules (~135 tests), including one that
          # segfaults at teardown and one that fails collection. Run the whole
          # directory; the binding-only module self-skips without `welllog`.
          python -m pytest -q --tb=short \
            --timeout=60 \
            --timeout-method=thread \
            well-log-engine/apps/wellplot-desktop/tests

  # Explicit product merge gate. See docs/ci-merge-policy.md.
  # Requires the FULL monorepo Tests matrix (CPython 3.12) plus the Well Log
  # Workstation host matrix. Cross-workflow: WellLogEngine C++ must also be
  # green (separate workflow well-log-engine.yml — required, not edited here).
  merge-gate:
    name: Merge gate (full monorepo + workstation)
    needs: [test, well-log-workstation]
    # Fail closed (#436): the implicit `if: success()` on a `needs` job makes
    # it SKIP — never fail — whenever a needed job fails, so the gate could
    # not block merging while the workstation matrix was red. `if: always()`
    # runs the gate on every outcome; the step below fails unless both product
    # gates are green (or the run was cancelled).
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm product gates
        run: |
          echo "Full monorepo Tests (CPython 3.12) matrix is green."
          echo "Well Log Workstation (host) matrix is green."
          echo "Also require workflow 'WellLogEngine C++' on the same SHA."
          echo "Policy: docs/ci-merge-policy.md."

      - name: Fail closed unless every product gate is green
        if: ${{ needs.test.result != 'success' || needs.well-log-workstation.result != 'success' }}
        run: |
          echo "A required product gate is not green:"
          echo "  Tests: ${{ needs.test.result }}"
          echo "  Well Log Workstation: ${{ needs.well-log-workstation.result }}"
          exit 1
