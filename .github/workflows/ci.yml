name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Full monorepo suite — required product gate (see docs/ci-merge-policy.md).
  # The suite must be green without quarantine; no continue-on-error.
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = package baseline; 3.13 = host/dev drift coverage (T-ENV-01)
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System libraries (Qt / offscreen / GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gdal-bin \
            libgdal-dev \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libegl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6
          # Make pip build of osgeo.gdal find the system library.
          echo "GDAL_CONFIG=$(command -v gdal-config)" >> "$GITHUB_ENV"
          gdal-config --version

      - name: Install Python dependencies
        env:
          GDAL_CONFIG: ${{ env.GDAL_CONFIG }}
        run: |
          python -m pip install --upgrade pip
          # Pin Python GDAL bindings to the system libgdal (Ubuntu runners ship ~3.8.x).
          # Unconstrained pip otherwise picks the latest sdist (e.g. 3.13) which fails to build.
          SYS_GDAL="$(gdal-config --version)"
          echo "System libgdal: ${SYS_GDAL}"
          echo "gdal==${SYS_GDAL}" > /tmp/gdal-constraint.txt
          # numpy first, then rebuild gdal so optional _gdal_array can link.
          # Pip wheels/sdists installed without numpy often omit the extension.
          python -m pip install "numpy>=1.26"
          python -m pip install --no-cache-dir "gdal==${SYS_GDAL}"
          python -m pip install --prefer-binary \
            -c /tmp/gdal-constraint.txt \
            -e ".[dev,native]"
          # geo-viz-engine subpackages (may pull shapely, scipy, …)
          if [ -f requirements-geoviz.txt ]; then
            python -m pip install --prefer-binary -r requirements-geoviz.txt || true
          fi
          # Core geoviz packages needed by mapping/preview tests
          python -m pip install -e geo-viz-engine/packages/geoviz_common || true
          python -m pip install -e geo-viz-engine/packages/geoviz_well_log || true
          python -m pip install -e geo-viz-engine/packages/geoviz_paleo_map || true
          python -m pip install -e geo-viz-engine/packages/geoviz_seismic || true
          python -m pip install -e geo-viz-engine/packages/geoviz_cross_well || true
          python -m pip install -e geo-viz-engine/packages/geoviz_plots || true
          python -m pip install -e geo-viz-engine/packages/geoviz_map || true
          python -m pip install -e geo-viz-engine/packages/geoviz_well_tie || true
          python -m pip install shapely

      - name: Build map_edit_core (required)
        run: |
          python -m pip install -e geo-viz-engine/native/map_edit_core
          python -c "from geoviz_plots.map_edit import HAS_CPP; assert HAS_CPP is True, 'HAS_CPP must be True in CI'"

      - name: Build grid_render_core (required)
        run: |
          python -m pip install -e native/grid_render_core
          python -c "import grid_render_core; assert hasattr(grid_render_core, 'render_grid_rgba'), 'grid_render_core.render_grid_rgba missing in CI'"

      - name: Build layer_model_core (required)
        run: |
          python -m pip install -e native/layer_model_core
          python -c "import layer_model_core; assert hasattr(layer_model_core, 'LayerRegistry'), 'layer_model_core.LayerRegistry missing in CI'"

      - name: Native C++ selftests (algorithm verification)
        run: |
          set -e
          g++ -std=c++17 -O2 -Wall -Wextra \
            native/grid_render_core/src/grid_render_core.cpp \
            native/grid_render_core/src/scalar_grid_layer.cpp \
            native/grid_render_core/src/standalone_test.cpp \
            -o /tmp/grid_render_selftest && /tmp/grid_render_selftest
          g++ -std=c++17 -O2 -Wall -Wextra \
            native/layer_model_core/src/layer_model.cpp \
            native/layer_model_core/src/standalone_test.cpp \
            -o /tmp/layer_model_selftest && /tmp/layer_model_selftest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: |
          # Per-test timeout (thread: better for pure-Python hangs; native still
          # may need the job-level ceiling). -v prints the last started test
          # when the suite dies so the hung case is identifiable in CI logs.
          # A green suite fits well inside the 60m job timeout (locally ~2m).
          python -m pytest -v --tb=line \
            --timeout=45 \
            --timeout-method=thread \
            -m "not slow" \
            --durations=25

  # Focused job for Well Log Workstation (#207 / PR #233): no geo-viz submodule,
  # no map_edit_core. Host-only (engine optional) so the workstation suite is
  # isolated from the monorepo install (see docs/ci-merge-policy.md).
  well-log-workstation:
    name: Well Log Workstation (host)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Workstation tests live in the well-log-engine submodule; only that
          # submodule is fetched below. geo-viz-engine stays unchecked out.
          submodules: false

      - name: Fetch well-log-engine submodule (workstation tests live there)
        run: git submodule update --init well-log-engine

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System libraries (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libegl1 \
            libxcb-cursor0 \
            libfontconfig1 \
            libfreetype6

      - name: Install workstation test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26" \
            "PySide6==6.11.1" \
            "lasio>=0.31" \
            "pytest>=8" \
            "pytest-qt>=4" \
            "pytest-timeout>=2.3"

      - name: Run well_log_workstation tests
        env:
          QT_QPA_PLATFORM: offscreen
          WLWS_DISABLE_ENGINE: "1"
          PYTHONPATH: ${{ github.workspace }}/well-log-engine/apps/wellplot-desktop:${{ github.workspace }}
        run: |
          # Host-only job: the engine bindings are not installed, so skip the
          # binding-contract test (hard module-level `import welllog`). All
          # other engine-optional tests self-skip via _native_importable().
          # (--ignore would not apply here: the shell expands the glob into
          # explicit file args, which bypass --ignore.)
          find well-log-engine/apps/wellplot-desktop/tests \
            -name "test_well_log_workstation_*.py" \
            ! -name "test_well_log_workstation_engine_bindings.py" \
            -exec python -m pytest -q --tb=short \
              --timeout=60 \
              --timeout-method=thread {} +

  # Explicit product merge gate. See docs/ci-merge-policy.md.
  # Requires the FULL monorepo Tests matrix (3.12 + 3.13) plus the Well Log
  # Workstation host matrix. Cross-workflow: WellLogEngine C++ must also be
  # green (separate workflow well-log-engine.yml — required, not edited here).
  merge-gate:
    name: Merge gate (full monorepo + workstation)
    needs: [test, well-log-workstation]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm product gates
        run: |
          echo "Full monorepo Tests (Python 3.12 + 3.13) matrix is green."
          echo "Well Log Workstation (host) matrix is green."
          echo "Also require workflow 'WellLogEngine C++' on the same SHA."
          echo "Policy: docs/ci-merge-policy.md."
