name: Perf gate (nightly)

# #940-4: benchmarks/ and scripts/bench_* had zero CI gate — interpolation /
# render regressions (#933/#934 family) could land unchecked. This dedicated
# nightly workflow closes the gap without touching the fast PR gate (ci.yml).
#
# Triggers: nightly schedule + manual dispatch only (never on PR push).
# Scope: bench_interpolation (--quick) + render-engine benchmark + the
# existing slow perf suite (tests/perf) share one job so native builds are
# not duplicated. Thresholds below reference issues #933/#934 baselines:
#   - #933: constrained IDW per-cell Python loop ~1.9s @200²×300w, target
#           <300 ms after cell-batch vectorization.
#   - #934: single-task IDW through plan kernel +31-53% vs naive (1940 vs
#           1375 ms @1024²×80w), target <5% delta after fallback to dense.
# Current nightly thresholds are deliberately loose (seconds-level) — they
# catch catastrophic regressions, not fine-grained drift. Tighten toward the
# #933/#934 targets as the vectorization lands.
#
# Workflow syntax is conservative: copies the install/build steps from
# ci.yml / slow-tests.yml verbatim so runner drift is minimal.

on:
  schedule:
    # Nightly 03:11 UTC — after slow-tests (02:17) to avoid runner contention.
    - cron: "11 3 * * *"
  workflow_dispatch:

jobs:
  perf:
    name: Perf gate (bench + slow-perf)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (Qt / offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            swig \
            libsqlite3-dev \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libegl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[dev,native]"
          # requirements-geoviz.txt is the single source of truth (see ci.yml).
          python -m pip install --prefer-binary -r requirements-geoviz.txt
          python -c "import geoviz, geoviz_well_seismic_3d"

      - name: Build vendored GDAL (+PROJ) from third_party sources
        run: |
          scripts/build_vendored_gdal.sh "$(command -v python)"
          source native/gdal-vendored/install/env.sh
          python -c "from osgeo import gdal; assert gdal.__version__"

      - name: Build map_edit_core (required)
        run: |
          python -m pip install -e geo-viz-engine/native/map_edit_core
          python -c "from geoviz_plots.map_edit import HAS_CPP; assert HAS_CPP is True, 'HAS_CPP must be True in CI'"

      - name: Build grid_render_core (required)
        run: |
          python -m pip install -e native/grid_render_core
          python -c "import grid_render_core; assert hasattr(grid_render_core, 'render_grid_rgba'), 'grid_render_core.render_grid_rgba missing'"

      - name: Build layer_model_core (required)
        run: |
          python -m pip install -e native/layer_model_core
          python -c "import layer_model_core; assert hasattr(layer_model_core, 'LayerRegistry'), 'layer_model_core.LayerRegistry missing'"

      - name: Build seismic_3d_core (required)
        run: |
          python -m pip install -e native/seismic_3d_core
          python -c "import seismic_3d_core; assert hasattr(seismic_3d_core, 'fast_slice_to_indexed8'), 'seismic_3d_core symbols missing'"

      - name: Build well_log_core (required)
        run: |
          python -m pip install -e native/well_log_core
          python -c "import well_log_core; assert hasattr(well_log_core, 'fast_las_parse_data'), 'well_log_core symbols missing'"

      - name: Run bench_interpolation (--quick) with threshold gate
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail
          source native/gdal-vendored/install/env.sh
          python scripts/bench_interpolation.py --quick --out /tmp/interp_bench.json 2>&1 | tee /tmp/interp_bench.txt
          cat /tmp/interp_bench.json
          python - <<'PY'
          import json, sys
          data = json.loads(open("/tmp/interp_bench.json").read())
          # Loose nightly budgets (seconds) — intentionally above the
          # #933/#934 tight targets so the gate is green today and can be
          # tightened as optimizations land. Fail only on catastrophic drift.
          # Thresholds mirror tests/perf/test_interpolation_perf.py soft budgets.
          budgets = {
              "S1_single_cold_idw": 8.0,   # 128²×40  (perf suite SMALL)
              "S6_constrained": 30.0,      # 64²×30
              "S5_live_cache_hits": 0.05,  # per-hit ms -> total ~ <50ms for 50 hits
          }
          failed = []
          for r in data["results"]:
              scen = r["scenario"]
              median = r.get("median_s", r.get("total_s", 0))
              # S5 uses total_s/per_hit_ms — normalize to total_s
              if scen == "S5_live_cache_hits":
                  median = r.get("total_s", 0)
              # scenario names in bench are exact; budgets keyed by prefix
              for prefix, budget in budgets.items():
                  if scen.startswith(prefix):
                      if median > budget:
                          failed.append(f"{scen}: {median:.3f}s > budget {budget:.3f}s")
                      else:
                          print(f"ok {scen}: {median:.3f}s <= {budget:.3f}s")
                      break
          if failed:
              print("::error::perf gate exceeded budgets:")
              for f in failed:
                  print("::error::  " + f)
              sys.exit(1)
          print("bench_interpolation gate: all budgets ok")
          # #933/#934 informational: log multi-batch vs single for future tightening
          for r in data["results"]:
              if "multi" in r["scenario"].lower():
                  print(f"info {r['scenario']}: median={r.get('median_s', 0):.3f}s")
          PY

      - name: Run render-engine benchmark with threshold gate
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail
          source native/gdal-vendored/install/env.sh
          python benchmarks/render_engine_benchmark.py --sizes 100 10000 --json /tmp/render_bench.json 2>&1 | tee /tmp/render_bench.txt
          cat /tmp/render_bench.json
          python - <<'PY'
          import json, sys
          data = json.loads(open("/tmp/render_bench.json").read())
          # Loose budgets: catch order-of-magnitude regressions only.
          # Tight targets (#933/#934 lineage) can be added once the
          # vectorized paths stabilize.
          failed = []
          for r in data:
              n = r["features"]
              # snapshot cold build scales with feature count
              budget_snap = 2.0 if n <= 100 else 10.0
              # first render includes geometry prep + paint
              budget_render = 2.0 if n <= 100 else 15.0
              if r["snapshot_build_cold_ms"] / 1000.0 > budget_snap:
                  failed.append(f"snap cold {n}: {r['snapshot_build_cold_ms']}ms > {budget_snap*1000:.0f}ms")
              if r["first_render_ms"] / 1000.0 > budget_render:
                  failed.append(f"first render {n}: {r['first_render_ms']}ms > {budget_render*1000:.0f}ms")
              else:
                  print(f"ok render {n}: first={r['first_render_ms']}ms snap={r['snapshot_build_cold_ms']}ms")
              # culling sanity: zoomed render should be faster than first at large sizes
              if n >= 10000 and r["zoom_render_ms"] > r["first_render_ms"]:
                  print(f"::warning:: culling: zoom {r['zoom_render_ms']}ms > first {r['first_render_ms']}ms at n={n}")
          if failed:
              print("::error::render gate exceeded budgets:")
              for f in failed:
                  print("::error::  " + f)
              sys.exit(1)
          print("render_engine gate: all budgets ok")
          PY

      - name: Run slow perf suite (tests/perf) as threshold gate
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail
          source native/gdal-vendored/install/env.sh
          python -m pytest -v --tb=short --timeout=300 -m slow tests/perf/ 2>&1 | tee /tmp/perf-slow.txt
          echo "perf slow suite: done (thresholds inside tests/perf/test_interpolation_perf.py)"
