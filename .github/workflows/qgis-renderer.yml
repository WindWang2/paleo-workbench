name: QGIS renderer

# QGIS production renderer bridge (packaging #437).
#
# The main CI workflow never builds `native/qgis_render_bridge`: it needs the
# vendored QGIS core (third_party/qgis, ~20-60 min ninja build) which is not
# worth paying on every PR. This dedicated leg makes the bridge genuinely
# buildable in CI and is FAIL-CLOSED (no continue-on-error), so a change that
# breaks the bridge build cannot silently land.
#
# Triggers: (1) manual `workflow_dispatch` from the Actions tab; (2) push/PR
# touching the bridge sources, the vendored QGIS tree, or this workflow.
# Normal PRs skip this leg entirely and only exercise the fallback renderer —
# see README "QGIS renderer (opt-in)" for the coverage statement.
#
# Runtime layout (the hard-won part — read before touching):
# - BUILD: the vendored QGIS + bridge compile against noble's system Qt 6.4
#   (apt qt6-base-dev & friends below).
# - RUNTIME: the test process loads BOTH the bridge (whose vendored QGIS
#   hard-requires Qt6Core5Compat — find_package REQUIRED) and a PySide6 that
#   supports Python 3.12 (>= 6.6, so bundled Qt >= 6.6). noble only ships
#   Core5Compat for Qt 6.4, and a 6.4-built Core5Compat dies on a >= 6.6
#   QtCore (removed QUtf8::convertFromUnicode symbol), so the runtime must be
#   a COMPLETE >= 6.6 Qt set including Core5Compat. That combination is not
#   installable via apt (noble is stuck on 6.4), pip (PySide6 wheels bundle
#   no Core5Compat) or aqtinstall (upstream repo metadata no longer parses),
#   but conda-forge's qt6-main ships Core5Compat inside the package. Hence
#   the /tmp/qgisqt conda env (python 3.12 + PySide6 6.11.1 + the whole Qt
#   6.11.1 runtime in ONE prefix) and the test steps putting that prefix's
#   lib/ first on LD_LIBRARY_PATH so every libQt6*.so.6 — Core5Compat
#   included — resolves to the same 6.11.1 build. The 6.4-built libqgis_core
#   runs on it per Qt's forward binary compatibility within Qt 6.
#
# Note: the system package list below follows QGIS 4.x build requirements
# (core + gui + analysis, WITH_AUTH=ON). If a future QGIS vendor bump changes
# requirements, adjust the apt list here; the job failing loudly is the point.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "native/qgis_render_bridge/**"
      - "third_party/qgis/**"
      - "paleo_workbench/mapping/**"
      - "paleo_workbench/ui/map_*"
      - "tests/test_qgis_*"
      - "tests/qgis_support.py"
      - ".github/workflows/qgis-renderer.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "native/qgis_render_bridge/**"
      - "third_party/qgis/**"
      - "paleo_workbench/mapping/**"
      - "paleo_workbench/ui/map_*"
      - "tests/test_qgis_*"
      - "tests/qgis_support.py"
      - ".github/workflows/qgis-renderer.yml"

jobs:
  build:
    name: QGIS renderer bridge (build smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: System libraries (Qt6 / QGIS build deps / bridge build tools)
        run: |
          sudo apt-get update
          # Names verified against ubuntu-latest (24.04 noble):
          # - QCA's Qt6 dev package is 'libqca-qt6-dev' (qca2 source pkg);
          #   'qca-qt6-dev' does not exist on noble.
          # - Qt6 QWT is not packaged on noble at all — but the vendored QGIS
          #   falls back to its internal external/qwt-6.3.0 copy when system
          #   Qwt >=6.2 is not found, so no QWT package is listed.
          # - nlohmann-json and poly2tri are consumed from the vendored
          #   external/ copies (PREFER_INTERNAL_LIBS=TRUE for non-vcpkg
          #   builds), so only Protobuf/QScintilla/qtkeychain/QCA are
          #   additionally required by the configure flags below (exiv2: WITH_EXIV2
          #   defaults ON and its find_package is REQUIRED).
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            libqt6svg6-dev \
            qt6-5compat-dev \
            qt6-multimedia-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            libqca-qt6-dev \
            libsqlite3-dev \
            libexpat1-dev \
            libproj-dev \
            libgeos-dev \
            libgdal-dev \
            libgsl-dev \
            libpq-dev \
            libzip-dev \
            libzstd-dev \
            zlib1g-dev \
            libbz2-dev \
            libspatialite-dev \
            libqt6opengl6-dev \
            libqt6concurrent6 \
            libprotobuf-dev \
            protobuf-compiler \
            libqscintilla2-qt6-dev \
            qtkeychain-qt6-dev \
            libexiv2-dev \
            bison \
            flex

      - name: Conda (just to drive `conda create`; env is used by absolute path)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: false

      - name: Create the qgisqt runtime env (python 3.12 + PySide6 6.11.1 + full Qt 6.11.1 incl. Core5Compat)
        # See the workflow header for why this env exists. All later steps
        # call /tmp/qgisqt/bin/python explicitly — no conda activation.
        run: |
          conda create -y -p /tmp/qgisqt -c conda-forge python=3.12 "pyside6=6.11.1"
          /tmp/qgisqt/bin/python -m pip install --upgrade pip
          # Deps land in the SAME env. PySide6 itself comes from conda (NOT
          # pip) so its Qt stays the prefix's single 6.11.1 set.
          # pydantic: tests/conftest.py's autouse session fixture imports the
          # paleo_workbench package (project.models). gdal (sdist build against
          # the libgdal-dev installed above, pinned to noble's gdal-config):
          # the map backend's optional-import surface (bridge capability probe).
          /tmp/qgisqt/bin/python -m pip install \
            "pybind11>=2.12" "ninja>=1.11" "pytest>=8.0" \
            "pytest-qt>=4.5.0" "pytest-timeout>=2.3.1" "numpy>=1.26" \
            "pydantic>=2" \
            "gdal==$(gdal-config --version)"
          # Fail fast (before the ~50 min vendored QGIS build) if the runtime
          # set is incomplete: Core5Compat present, offscreen Qt importable.
          ls /tmp/qgisqt/lib/libQt6Core5Compat.so.6
          QT_QPA_PLATFORM=offscreen /tmp/qgisqt/bin/python -c "
            from PySide6.QtCore import qVersion
            from PySide6.QtWidgets import QApplication
            QApplication([])
            print('qgisqt runtime OK, Qt', qVersion())
          "

      - name: Build vendored QGIS + qgis_render_bridge (opt-in)
        env:
          PALEO_WITH_QGIS_RENDERER: "1"
          PALEO_QGIS_BUILD_JOBS: "4"
        run: |
          /tmp/qgisqt/bin/python -m pip install -e native/qgis_render_bridge

      - name: Import smoke (bridge must load with the vendored QGIS runtime)
        run: |
          /tmp/qgisqt/bin/python -c "import qgis_render_bridge; print('qgis_render_bridge imported from', qgis_render_bridge.__file__)"

      - name: Vendor integrity + bridge source contract checks
        run: |
          /tmp/qgisqt/bin/python -m pytest -q tests/test_qgis_vendor_source.py --timeout=60 --timeout-method=thread

      - name: Unify the Qt runtime (conda prefix wins)
        # Every libQt6*.so.6 — including libQt6Core5Compat.so.6, which only
        # exists inside the conda prefix — must resolve to the prefix's single
        # 6.11.1 build; otherwise the loader mixes noble's 6.4 Core5Compat
        # with a 6.11 QtCore and bridge imports die on the removed
        # QUtf8::convertFromUnicode symbol.
        run: |
          echo "LD_LIBRARY_PATH=/tmp/qgisqt/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: QGIS tests are selected, not silently skipped — and executed
        # The leg must fail if the QGIS test set ever stops being selected
        # (e.g. a rename), so the production path cannot silently lose
        # coverage. Two fail-closed counts (#935): (a) collect-only must list
        # >=9 qgis tests ("N tests collected" is collect-mode output), and
        # (b) the real run summary must show them passing ("N passed" is
        # run-mode output — the old regex greped a phrase run mode never
        # prints, and its double-backslash pattern could never match).
        run: |
          set -o pipefail
          # Collect ONLY the files that carry the qgis marker: a bare
          # `tests/` walk collection-errors on modules importing the geoviz
          # graph, which this focused leg deliberately does not install.
          # The file list is derived from the marker itself (rename-safe:
          # a renamed file drops out of the list and the >=9 count guard
          # below fails loudly).
          mapfile -t QGIS_FILES < <(
            for f in $(grep -rl "pytest.mark.qgis" tests --include='*.py' | sort); do
              # Exclude files that import the native engines directly OR via a
              # known transitive carrier. A plain top-level `^(from|import)
              # geoviz` grep is not enough: these test files never name geoviz
              # themselves, but importing the paleo_workbench modules below
              # pulls geoviz in at module scope on this leg, which deliberately
              # does not install it. Extend the carrier list when a new
              # collection error of the form ModuleNotFoundError: geoviz
              # appears — the >=9 collected guard below fails loudly either way.
              grep -qE "^(from|import) (geoviz|grid_render_core|layer_model_core|seismic_3d_core|well_log_core|map_edit_core)|paleo_workbench\.(workflow\.factor_interpolation|viz\.native_factor_map|ui\.pages\.mapping_page)" "$f" || echo "$f"
            done
          )
          echo "qgis marker files: ${QGIS_FILES[*]}"
          QT_QPA_PLATFORM=offscreen /tmp/qgisqt/bin/python -m pytest -v --tb=short --timeout=120 -m qgis "${QGIS_FILES[@]}" 2>&1 | tee /tmp/qgis-run.txt
          collected="$(QT_QPA_PLATFORM=offscreen /tmp/qgisqt/bin/python -m pytest --collect-only -q -m qgis "${QGIS_FILES[@]}" 2>/dev/null | grep -oE '[0-9]+ tests collected' | grep -oE '^[0-9]+')"
          test -n "${collected}" && test "${collected}" -ge 9
          /tmp/qgisqt/bin/python - <<'EOF'
          import re
          text = open("/tmp/qgis-run.txt").read()
          m = re.search(r"^=+ .*?(\d+) passed.*? =+$", text, re.M)
          assert m and int(m.group(1)) >= 9, (
              f"expected >=9 qgis tests to PASS in the run summary, got: {text[-2000:]}"
          )
          print(f"qgis gate: {m.group(1)} passed (executed, not just collected)")
          EOF
