name: QGIS renderer

# QGIS production renderer bridge (packaging #437).
#
# The main CI workflow never builds `native/qgis_render_bridge`: it needs the
# vendored QGIS core (third_party/qgis, ~20-60 min ninja build) which is not
# worth paying on every PR. This dedicated leg makes the bridge genuinely
# buildable in CI and is FAIL-CLOSED (no continue-on-error), so a change that
# breaks the bridge build cannot silently land.
#
# Triggers: (1) manual `workflow_dispatch` from the Actions tab; (2) push/PR
# touching the bridge sources, the vendored QGIS tree, or this workflow.
# Normal PRs skip this leg entirely and only exercise the fallback renderer —
# see README "QGIS renderer (opt-in)" for the coverage statement.
#
# Note: the system package list below follows QGIS 4.x build requirements
# (core + gui + analysis, WITH_AUTH=ON). If a future QGIS vendor bump changes
# requirements, adjust the apt list here; the job failing loudly is the point.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "native/qgis_render_bridge/**"
      - "third_party/qgis/**"
      - "paleo_workbench/mapping/**"
      - "paleo_workbench/ui/map_*"
      - "tests/test_qgis_*"
      - "tests/qgis_support.py"
      - ".github/workflows/qgis-renderer.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "native/qgis_render_bridge/**"
      - "third_party/qgis/**"
      - "paleo_workbench/mapping/**"
      - "paleo_workbench/ui/map_*"
      - "tests/test_qgis_*"
      - "tests/qgis_support.py"
      - ".github/workflows/qgis-renderer.yml"

jobs:
  build:
    name: QGIS renderer bridge (build smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: System libraries (Qt6 / QGIS build deps / bridge build tools)
        run: |
          sudo apt-get update
          # Names verified against ubuntu-latest (24.04 noble):
          # - QCA's Qt6 dev package is 'libqca-qt6-dev' (qca2 source pkg);
          #   'qca-qt6-dev' does not exist on noble.
          # - Qt6 QWT is not packaged on noble at all — but the vendored QGIS
          #   falls back to its internal external/qwt-6.3.0 copy when system
          #   Qwt >=6.2 is not found, so no QWT package is listed.
          # - nlohmann-json and poly2tri are consumed from the vendored
          #   external/ copies (PREFER_INTERNAL_LIBS=TRUE for non-vcpkg
          #   builds), so only Protobuf/QScintilla/qtkeychain/QCA are
          #   additionally required by the configure flags below (exiv2: WITH_EXIV2
          #   defaults ON and its find_package is REQUIRED).
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            libqt6svg6-dev \
            qt6-5compat-dev \
            qt6-multimedia-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            libqca-qt6-dev \
            libsqlite3-dev \
            libexpat1-dev \
            libproj-dev \
            libgeos-dev \
            libgdal-dev \
            libgsl-dev \
            libpq-dev \
            libzip-dev \
            libzstd-dev \
            zlib1g-dev \
            libbz2-dev \
            libspatialite-dev \
            libqt6opengl6-dev \
            libqt6concurrent6 \
            libprotobuf-dev \
            protobuf-compiler \
            libqscintilla2-qt6-dev \
            qtkeychain-qt6-dev \
            libexiv2-dev \
            bison \
            flex

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pybind11>=2.12" "ninja>=1.11" "pytest>=8.0"

      # Audit #935: every pytest step below needs pytest-timeout, PySide6 (the
      # bridge requires a live Qt runtime) and numpy (qgis test modules import
      # it at module level). Install them ONCE, before the first pytest step —
      # the previous order ran pytest with --timeout before its plugin existed
      # and made this leg fail on every trigger.
      - name: Install QGIS test deps
        run: |
          python -m pip install "PySide6==6.11.1" "pytest-qt>=4.5.0" "pytest-timeout>=2.3.1" "numpy>=1.26"

      - name: Build vendored QGIS + qgis_render_bridge (opt-in)
        env:
          PALEO_WITH_QGIS_RENDERER: "1"
          PALEO_QGIS_BUILD_JOBS: "4"
        run: |
          python -m pip install -e native/qgis_render_bridge

      - name: Import smoke (bridge must load with the vendored QGIS runtime)
        run: |
          python -c "import qgis_render_bridge; print('qgis_render_bridge imported from', qgis_render_bridge.__file__)"

      - name: Vendor integrity + bridge source contract checks
        run: |
          python -m pytest -q tests/test_qgis_vendor_source.py --timeout=60 --timeout-method=thread

      - name: QGIS tests are selected, not silently skipped — and executed
        # The leg must fail if the QGIS test set ever stops being selected
        # (e.g. a rename), so the production path cannot silently lose
        # coverage. Two fail-closed counts (#935): (a) collect-only must list
        # >=9 qgis tests ("N tests collected" is collect-mode output), and
        # (b) the real run summary must show them passing ("N passed" is
        # run-mode output — the old regex greped a phrase run mode never
        # prints, and its double-backslash pattern could never match).
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen python -m pytest -v --tb=short --timeout=120 -m qgis tests/ 2>&1 | tee /tmp/qgis-run.txt
          collected="$(QT_QPA_PLATFORM=offscreen python -m pytest --collect-only -q -m qgis tests/ 2>/dev/null | grep -oE '[0-9]+ tests collected' | grep -oE '^[0-9]+')"
          test -n "${collected}" && test "${collected}" -ge 9
          python - <<'EOF'
          import re
          text = open("/tmp/qgis-run.txt").read()
          m = re.search(r"^=+ .*?(\d+) passed.*? =+$", text, re.M)
          assert m and int(m.group(1)) >= 9, (
              f"expected >=9 qgis tests to PASS in the run summary, got: {text[-2000:]}"
          )
          print(f"qgis gate: {m.group(1)} passed (executed, not just collected)")
          EOF
