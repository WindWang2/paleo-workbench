# Segfault diagnostics for #951 (3.13-only SIGSEGV under pytestqt
# _process_events → Qt event dispatch, no project frames).
#
# Two non-blocking legs that mirror the main gate environment exactly
# (same deps, vendored GDAL, freshly built cores) and add instrumentation:
#
#   gdb-backtrace — full suite under gdb; on SIGSEGV print the crashing
#     C backtrace and all threads directly into the job log. This is the
#     "#951 recommendation 2" coredump analysis, minus the artifact
#     download: the backtrace lands in the log.
#
#   asan — rebuild the five native cores with -fsanitize=address, run the
#     full suite with libasan preloaded and PYTHONMALLOC=malloc so the
#     Python object heap goes through the interposed allocator. Catches
#     heap corruption (double free / invalid free / UAF-on-free, plus
#     redzone violations inside our instrumented cores) at the moment it
#     happens instead of at the later, drifting crash site.
#
# Both legs are diagnostics: continue-on-error, never gate merges. The
# main gate stays in ci.yml (3.12 product gate + non-blocking 3.13 legs).

name: Segfault diagnostic (#951)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: segfault-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Shared environment/dependency steps are duplicated per job on purpose:
# YAML anchors are not available in GitHub Actions, and a reusable
# composite action for a diagnostic workflow is not worth the indirection.

jobs:
  gdb-backtrace:
    name: gdb backtrace (3.13, full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    env:
      PIP_IGNORE_REQUIRES_PYTHON: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: System libraries (Qt / offscreen / debugger)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build swig \
            libsqlite3-dev libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 \
            gdb libasan8

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[dev,native]"
          python -m pip install --prefer-binary -r requirements-geoviz.txt
          python -c "import geoviz, geoviz_well_seismic_3d"
          python -m pip install shapely

      - name: Build vendored GDAL (+PROJ)
        run: |
          scripts/build_vendored_gdal.sh "$(command -v python)"
          source native/gdal-vendored/install/env.sh
          python -c "from osgeo import gdal; assert gdal.__version__"

      - name: Build native cores
        run: |
          python -m pip install -e geo-viz-engine/native/map_edit_core
          python -m pip install -e native/grid_render_core
          python -m pip install -e native/layer_model_core
          python -m pip install -e native/seismic_3d_core
          python -m pip install -e native/well_log_core

      - name: Run suite under gdb (SIGSEGV → C backtrace in log)
        run: |
          source native/gdal-vendored/install/env.sh
          set +e
          gdb -q -batch \
            -ex "set pagination off" \
            -ex "set print thread-events off" \
            -ex "handle SIGSEGV stop print nopass" \
            -ex "handle SIGABRT stop print nopass" \
            -ex "run" \
            -ex "echo \n\n===== INFERIOR STOPPED: C BACKTRACE =====\n" \
            -ex "bt" \
            -ex "echo \n\n===== ALL THREADS (30 frames) =====\n" \
            -ex "thread apply all bt 30" \
            --args python -m pytest -v --tb=line \
              --timeout=90 --timeout-method=thread \
              -m "not slow and not welllog_binding"
          echo "gdb batch finished (exit $?) — if a crash stopped the inferior, the backtraces above are the #951 evidence."

  asan:
    name: ASan (3.13, instrumented cores + interposed allocator)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    env:
      PIP_IGNORE_REQUIRES_PYTHON: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
      # pymalloc would hide the C heap from the interposed allocator; route
      # Python object allocation through malloc so ASan sees it.
      PYTHONMALLOC: malloc
      # Leak detection off (Qt/runner noise, and ptrace is restricted on
      # hosted runners); stop at the first real heap error with full context.
      ASAN_OPTIONS: detect_leaks=0:detect_odr_violation=0:halt_on_error=1:abort_on_error=0:malloc_context_size=30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: System libraries (Qt / offscreen / ASan runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build swig \
            libsqlite3-dev libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 \
            libasan8

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[dev,native]"
          python -m pip install --prefer-binary -r requirements-geoviz.txt
          python -c "import geoviz, geoviz_well_seismic_3d"
          python -m pip install shapely

      - name: Build vendored GDAL (+PROJ)
        # Deliberately NOT instrumented: compiling all of GDAL+PROJ with
        # ASan would add ~15min and a second allocator universe; the
        # interposed runtime still watches its allocations.
        run: |
          scripts/build_vendored_gdal.sh "$(command -v python)"
          source native/gdal-vendored/install/env.sh
          python -c "from osgeo import gdal; assert gdal.__version__"

      - name: Build native cores with ASan instrumentation
        env:
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer -g -O1
          CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer -g -O1
          LDFLAGS: -fsanitize=address
        run: |
          python -m pip install -e geo-viz-engine/native/map_edit_core
          python -m pip install -e native/grid_render_core
          python -m pip install -e native/layer_model_core
          python -m pip install -e native/seismic_3d_core
          python -m pip install -e native/well_log_core

      - name: Run suite under ASan interposition
        run: |
          source native/gdal-vendored/install/env.sh
          ASAN_LIB="$(gcc -print-file-name=libasan.so)"
          ls -l "$ASAN_LIB"
          set +e
          LD_PRELOAD="$ASAN_LIB" python -m pytest -v --tb=line \
            --timeout=120 --timeout-method=thread \
            -m "not slow and not welllog_binding"
          echo "pytest finished (exit $?) — ASan findings, if any, are printed above as ERROR: AddressSanitizer blocks."
