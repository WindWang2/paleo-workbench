# Segfault diagnostics for #951 (3.13-only SIGSEGV under pytestqt
# _process_events → Qt event dispatch, no project frames).
#
# crash-watchdog — full suite with a hang watchdog: an external ABRT
#   fires after 45 min without completion (under a plain gdb wrapper the
#   suite HUNG at ~44% where the bare run SIGSEGVs at ~46% — timing-
#   sensitive UB). Either way (crash or hang) a core dump is taken and
#   gdb prints the crashing C backtrace plus all threads into the job
#   log; faulthandler prints the Python frames first.
#
#   Run 2 deliverable (posted to #951): the SIGSEGV fires inside
#   QTimerInfoList::activateTimers → QCoreApplication::notifyInternal2
#   during inter-test event processing — a stale QTimer delivering into
#   a destroyed QObject.
#
# ASan leg: REMOVED after three iterations — LD_PRELOAD-style ASan
#   interposition is structurally incompatible with this dependency
#   stack on hosted runners:
#     1. gcc-13 libasan: the __cxa_throw interceptor CHECK-fails
#        ("real___cxa_throw == 0") the first time pyproj's bundled
#        libproj throws a C++ exception (exit 86 at the first CRS parse).
#     2. ASAN_OPTIONS=intercept_cxa_throw=0: not honored by that
#        runtime — identical failure.
#     3. clang-18 libclang_rt: dies silently (exit 86, zero output)
#        during pytest collection.
#   The crash-watchdog leg above is the primary instrument; it works for
#   both manifestations and needs no allocator interposition.
#
# This workflow is a diagnostic: continue-on-error, never gates merges.
# The main gate stays in ci.yml (3.12 product gate + non-blocking 3.13
# legs).

name: Segfault diagnostic (#951)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: segfault-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crash-watchdog:
    name: Crash watchdog (3.13, core dump + backtrace)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    env:
      PIP_IGNORE_REQUIRES_PYTHON: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: System libraries (Qt / offscreen / debugger)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build swig \
            libsqlite3-dev libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 \
            gdb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[dev,native]"
          python -m pip install --prefer-binary -r requirements-geoviz.txt
          python -c "import geoviz, geoviz_well_seismic_3d"
          python -m pip install shapely

      - name: Build vendored GDAL (+PROJ)
        run: |
          scripts/build_vendored_gdal.sh "$(command -v python)"
          source native/gdal-vendored/install/env.sh
          python -c "from osgeo import gdal; assert gdal.__version__"

      - name: Build native cores
        run: |
          python -m pip install -e geo-viz-engine/native/map_edit_core
          python -m pip install -e native/grid_render_core
          python -m pip install -e native/layer_model_core
          python -m pip install -e native/seismic_3d_core
          python -m pip install -e native/well_log_core

      - name: Run suite with crash/hang watchdog
        # The bare suite SIGSEGVs at ~46% (3.13 only); under a debugger it
        # HANGS at ~44% instead. Both must produce evidence in the log:
        #   - crash: kernel core dump on the faulting signal
        #   - hang:  external ABRT after WATCHDOG_S, forcing faulthandler
        #            Python frames + a core dump of the stuck process
        run: |
          source native/gdal-vendored/install/env.sh
          sudo sysctl -w "kernel.core_pattern=/tmp/core.%e.%p" || true
          ulimit -c unlimited
          WATCHDOG_S=2700   # 45 min; a healthy suite finishes in ~15
          set +e
          timeout --signal=ABRT --kill-after=60 "$WATCHDOG_S" \
            python -m pytest -v --tb=line \
              --timeout=120 --timeout-method=thread \
              -m "not slow and not welllog_binding"
          code=$?
          echo "pytest exit: $code  (124=hang watchdog fired, 134=SIGABRT, 139=SIGSEGV)"
          shopt -s nullglob
          cores=(/tmp/core.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "no core dumps found"
          fi
          for c in "${cores[@]}"; do
            echo ""
            echo "===== CORE DUMP: $c ====="
            gdb -q -batch \
              -ex "set pagination off" \
              -ex "bt" \
              -ex "echo \\n===== ALL THREADS (30 frames) =====\\n" \
              -ex "thread apply all bt 30" \
              "$(command -v python)" "$c" 2>&1 | tail -n +1
          done
