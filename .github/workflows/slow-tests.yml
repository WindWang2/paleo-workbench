name: Slow tests (nightly)

# Packaging #442: the fast CI gate intentionally runs `-m "not slow"`, but the
# 14 slow tests are the ONLY end-to-end real-data coverage (real LAS/DAT/SEGY
# vendor formats, tests/test_geoviz_real_data_smoke.py) and the interpolation
# performance gates (tests/perf/test_interpolation_perf.py). Nothing else ever
# ran them, and they self-skip when the gitignored data/ tree is absent — so
# the whole family could silently never run anywhere.
#
# This leg executes the full slow family on a schedule (and on manual
# dispatch). It is FAIL-CLOSED in two ways:
#   1. If the slow family shrinks below its 14-test baseline, the leg fails.
#   2. If the representative data tree is absent, the real-data tests skip and
#      the leg fails with an explicit message — never a silent green.
# Providing the data makes the leg green; the perf gates then run too.

on:
  schedule:
    # Nightly 02:17 UTC (outside the PR fast gate).
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  slow:
    name: Slow tests (real-data + perf)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (Qt / offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            swig \
            libsqlite3-dev \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libegl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[dev,native]"
          # Fail-closed geoviz graph (packaging #442): requirements-geoviz.txt
          # is the single source of truth; a broken graph fails this step.
          python -m pip install --prefer-binary -r requirements-geoviz.txt
          python -c "import geoviz, geoviz_well_seismic_3d"

      - name: Build vendored GDAL (+PROJ) from third_party sources
        # ADR 0060: same superbuild as ci.yml — no system libgdal.
        run: |
          scripts/build_vendored_gdal.sh "$(command -v python)"
          source native/gdal-vendored/install/env.sh
          python -c "from osgeo import gdal; assert gdal.__version__"

      # The nightly collects the whole tests/ tree (`-m slow` still imports
      # every module), and 55 modules import the native cores at collection
      # time. Without these builds the leg dies with 55
      # "ModuleNotFoundError: No module named 'grid_render_core'" collection
      # errors before a single slow test runs — the exact steps ci.yml
      # already performs, mirrored here.
      - name: Build map_edit_core (required)
        run: |
          python -m pip install -e geo-viz-engine/native/map_edit_core
          python -c "from geoviz_plots.map_edit import HAS_CPP; assert HAS_CPP is True, 'HAS_CPP must be True in CI'"

      - name: Build grid_render_core (required)
        run: |
          python -m pip install -e native/grid_render_core
          python -c "import grid_render_core; assert hasattr(grid_render_core, 'render_grid_rgba'), 'grid_render_core.render_grid_rgba missing'"

      - name: Build layer_model_core (required)
        run: |
          python -m pip install -e native/layer_model_core
          python -c "import layer_model_core; assert hasattr(layer_model_core, 'LayerRegistry'), 'layer_model_core.LayerRegistry missing'"

      - name: Build seismic_3d_core (required)
        run: |
          python -m pip install -e native/seismic_3d_core
          python -c "import seismic_3d_core; assert hasattr(seismic_3d_core, 'fast_slice_to_indexed8'), 'seismic_3d_core symbols missing'"

      - name: Build well_log_core (required)
        run: |
          python -m pip install -e native/well_log_core
          python -c "import well_log_core; assert hasattr(well_log_core, 'fast_las_parse_data'), 'well_log_core symbols missing'"

      - name: Assert the slow family has not silently shrunk
        # Baseline 15 = 7 real-data smoke + 5 interpolation perf + 2 real SEGY axis contracts (#650) + 1 fence probe (#896).
        run: |
          count="$(python -m pytest --collect-only -q -m slow tests/ 2>&1 | grep -oE '[0-9]+ tests collected' | grep -oE '^[0-9]+')"
          echo "slow tests collected: ${count} (baseline 15)"
          test -n "${count}" && test "${count}" -ge 15

      - name: Run slow tests (real-data smoke + interpolation perf gates)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail
          # Vendored GDAL env (ADR 0060).
          source native/gdal-vendored/install/env.sh
          python -m pytest -v --tb=short --timeout=300 -m slow tests/ 2>&1 | tee /tmp/slow-run.txt
          # Fail-closed on data availability: the real-data tests self-skip
          # when the representative data tree is absent (gitignored `data/`).
          # A leg that skipped all of them must not report green.
          python - <<'EOF'
          import re, sys
          text = open("/tmp/slow-run.txt").read()
          # Three skip phrases must all be fail-closed (#896): the smoke
          # family uses "representative data file is absent", the axis
          # contract uses "demo SEGY not available", the fence probe uses
          # "no demo SEGY". Any of them skipping must fail the leg.
          SLOW_SKIP_RE = r"representative data file is absent|demo SEGY not available|no demo SEGY"
          absent = len(re.findall(SLOW_SKIP_RE, text))
          summary = re.findall(r"^=+ .* =+$", text, re.M)
          print("\n".join(summary[-3:]))
          if absent:
              print(
                  "::error::packaging #442/#896: "
                  f"{absent} slow test(s) skipped - the representative "
                  "data tree / demo SEGY is absent (see tests/test_geoviz_real_data_smoke.py, "
                  "tests/test_seismic_timeslice_axis_contract.py, "
                  "tests/test_well_seismic_fence_probe.py). Provide the data and "
                  "re-run this workflow manually - otherwise the only end-to-end "
                  "vendor-format / SEGY coverage never runs."
              )
              sys.exit(1)
          print(f"slow skips (all 3 phrases): {absent} (0 required for a green leg)")
          EOF
