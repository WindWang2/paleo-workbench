<!DOCTYPE html>
<!-- PROTOTYPE — UI v2 Ribbon 重设计，一次性原型，不进生产代码 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI v2 Ribbon 原型 · paleo_workbench</title>
<style>
/* ===== Stratum 令牌（亮主题） ===== */
:root{
  --primary:#0c3f3b; --accent:#c2410c; --on-primary:#fff; --primary-hover:#09302c;
  --success:#15803d; --warning:#b45309; --error:#d31f1f; --teal:#0f766e;
  --bg-body:#f6f3ec; --bg-header:#fbf8f1; --bg-sidebar:#fffdf9; --bg-search:#efe9db;
  --bg-nav-active:#eae2cd; --bg-menu-hover:#f1ebdc; --bg-selection:#f3e3d3;
  --rail:#132a28; --rail-hover:#1b3632; --rail-active:#24514b; --text-rail:#b9cec8; --text-rail-active:#f2f7f5;
  --text-primary:#141210; --text-secondary:#514c45;
  --border:#e2dac8; --border-strong:#cec4ac; --border-light:#eee8d9;
  --canvas:#131d1b; --on-canvas:#eef4f1;
  --st1:#0c3f3b; --st2:#c2410c; --st3:#4a5899; --st4:#4d6b2f; --st5:#a44a3f; --st6:#5d564b;
  --menu-h:40px; --status-h:26px; --rail-w:64px; --dockrail-w:36px; --ctl-h:30px;
  --rbtn:4px; --rcard:8px; --pad-page:16px; --pad-panel:12px;
  --font:Inter,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:13px;color:var(--text-primary);background:var(--bg-body);overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
svg.ic{display:inline-block;width:18px;height:18px;flex:none;vertical-align:-4px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;height:100vh;min-width:1080px}
.app-b{flex-direction:row}
.app-a,.app-c{flex-direction:column}
.muted{color:var(--text-secondary)}
.grow{flex:1;min-width:0}
/* ===== 通用组件 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--ctl-h);padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--rbtn);background:var(--bg-header);color:var(--text-primary);font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;user-select:none}
.btn:hover{background:var(--bg-menu-hover)}
.btn:active{transform:translateY(1px)}
.btn .ic{width:15px;height:15px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{color:var(--error);border-color:#e2b4b4}
.btn.sm{height:24px;font-size:12px;padding:0 8px}
.btn.tgl.on{background:var(--bg-selection);border-color:var(--accent);color:var(--accent);font-weight:600}
.ibtn{width:26px;height:26px;padding:0;justify-content:center}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg-sidebar);border:1px solid var(--border);border-radius:var(--rcard);overflow:hidden}
.panel-h{height:34px;flex:none;display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid var(--border-light);font-size:13px;font-weight:600}
.panel-h .ic{width:15px;height:15px;color:var(--primary)}
.panel-b{flex:1;overflow:auto;padding:var(--pad-panel);min-height:0}
.panel-b.tight{padding:6px}
.flic{margin-left:auto;font-weight:400;color:var(--text-secondary);cursor:pointer;font-size:12.5px;padding:2px 4px;border-radius:4px}
.flic:hover{background:var(--bg-menu-hover);color:var(--accent)}
.card{background:var(--bg-sidebar);border:1px solid var(--border);border-radius:var(--rcard);padding:var(--pad-panel);min-width:0}
.card h4{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:10px}
.card h4 .ic{width:16px;height:16px;color:var(--primary)}
.ptoolbar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--border-light);flex:none;background:var(--bg-header)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 6px;flex:none;background:var(--bg-header);overflow-x:auto}
.tab{height:29px;padding:0 12px;display:flex;align-items:center;font-size:12.5px;border-bottom:2px solid transparent;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text-primary)}
.tab.on{color:var(--primary);border-bottom-color:var(--accent);font-weight:600}
.pane{display:none}
.pane.on{display:block}
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:9px;font-size:11px;background:var(--bg-nav-active);color:var(--text-secondary);white-space:nowrap;flex:none}
.chip.ok{background:#e2f0e4;color:var(--success)}
.chip.warn{background:#f8ecd9;color:var(--warning)}
.chip.err{background:#fae2e2;color:var(--error)}
.chip.run{background:#e5e8f4;color:var(--st3)}
.chip.info{background:#e2efee;color:var(--teal)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--bg-search);text-align:left;font-weight:600;padding:5px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--border-light);white-space:nowrap}
.tbl tbody tr:hover td{background:var(--bg-menu-hover)}
.tbl tbody tr.sel td{background:var(--bg-selection)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--border-light);font-size:12.5px}
.kv span{color:var(--text-secondary)}
.kv b{font-weight:600;text-align:right}
.ck{width:14px;height:14px;border:1.5px solid var(--border-strong);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;background:#fff;flex:none;cursor:pointer}
.ck.on::after{content:"✓";font-size:10px;line-height:1;color:var(--primary);font-weight:700}
.tnode .tkids{display:none;padding-left:18px}
.tnode.open .tkids{display:block}
.trow{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px;border-radius:4px;cursor:pointer;white-space:nowrap;font-size:12.5px}
.trow:hover{background:var(--bg-menu-hover)}
.trow .tw{width:12px;flex:none;color:var(--text-secondary);font-size:9px;transition:transform .12s}
.tnode.open>.trow .tw{transform:rotate(90deg)}
.trow .cnt{color:var(--text-secondary);font-size:11px}
.trow.on{background:var(--bg-nav-active);font-weight:600}
.pg{height:6px;background:var(--bg-search);border-radius:3px;overflow:hidden;flex:1}
.pg i{display:block;height:100%;background:var(--teal)}
.sw{width:34px;height:18px;border-radius:9px;background:var(--border-strong);position:relative;cursor:pointer;transition:.15s;flex:none;display:inline-block}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--primary)}
.sw.on::after{left:18px}
.seg{display:inline-flex;background:var(--bg-search);border:1px solid var(--border-strong);border-radius:6px;padding:2px;gap:2px}
.seg i{font-style:normal;padding:3px 14px;border-radius:4px;font-size:12.5px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.seg i.on{background:var(--bg-header);color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.big i{padding:7px 22px;font-size:13px}
select,input[type=text]{height:var(--ctl-h);border:1px solid var(--border-strong);border-radius:var(--rbtn);background:#fff;font:inherit;font-size:12.5px;padding:0 8px;color:var(--text-primary);outline:none}
select:focus,input[type=text]:focus{border-color:var(--primary)}
input[type=range]{accent-color:var(--primary);cursor:pointer}
.ebar{display:grid;grid-template-columns:56px 1fr 42px;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
.ebar .pg{background:var(--bg-search)}
.ph-box{border:1.5px dashed var(--border-strong);border-radius:6px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-secondary);background:var(--bg-header);text-align:center;padding:10px}
.pdf-page{width:76%;margin:10px auto;background:#fff;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.08);padding:18px 16px;min-height:170px;color:var(--text-secondary);font-size:12px}
.tl{height:6px;background:var(--bg-search);border-radius:3px;margin:6px 0}
.tl.h{width:55%}
.logpre{font-family:var(--mono);font-size:11px;line-height:1.7;color:#d8e5e1;background:var(--canvas);border-radius:6px;padding:10px;white-space:pre-wrap}
.banner{display:flex;align-items:center;gap:10px;background:#f8ecd9;border:1px solid #ecd9b7;color:var(--warning);border-radius:var(--rcard);padding:9px 14px;font-size:13px}
/* ===== 内容布局 ===== */
.content{flex:1;min-height:0;overflow:auto;position:relative;padding:var(--pad-page)}
.absfill{position:absolute;inset:var(--pad-page);display:grid;gap:12px;min-height:0}
.lay-tri{grid-template-columns:250px minmax(0,1fr) 310px}
.lay-grid4{grid-template-columns:225px minmax(360px,1.5fr) 330px 295px}
.lay-bi{grid-template-columns:minmax(0,1fr) 330px}
/* ===== 概述页 ===== */
.flowwrap{display:grid;gap:12px;align-content:start;min-height:100%;
  grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) 340px;
  grid-template-areas:"wf wf wf" "mp mp st" "mp mp it" "fl fl ac"}
.a-wf{grid-area:wf}.a-map{grid-area:mp}.a-start{grid-area:st}.a-integ{grid-area:it}.a-flow{grid-area:fl}.a-act{grid-area:ac}
.a-map{padding:0;display:flex;flex-direction:column;overflow:hidden}
.a-map .map-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border-light);font-weight:600}
.wf{display:flex;align-items:center}
.wf-step{display:flex;align-items:center;gap:9px}
.wf-dot{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.wf-name{font-weight:600;font-size:13px;white-space:nowrap}
.wf-sub{font-size:11px;color:var(--text-secondary);white-space:nowrap}
.wf-line{height:4px;border-radius:2px;background:var(--bg-search);flex:1;margin:0 12px;position:relative;overflow:hidden;min-width:24px}
.wf-line i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.bigbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--border-strong);background:var(--bg-header);border-radius:6px;padding:9px 12px;cursor:pointer;font:inherit;text-align:left;margin-bottom:8px}
.bigbtn:hover{background:var(--bg-menu-hover)}
.bigbtn .ic{width:20px;height:20px;color:var(--primary)}
.bigbtn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.bigbtn.primary .ic{color:var(--on-primary)}
.bigbtn b{font-size:13px;display:block}
.bigbtn small{font-size:11px;opacity:.75}
.integ-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.integ-row .ic{width:15px;height:15px;flex:none}
.act-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border-light);font-size:12.5px;align-items:baseline}
.act-row time{color:var(--text-secondary);font-size:11px;flex:none;width:44px}
.map-head-t{font-weight:600}
/* ===== 地图画布通用 ===== */
.coord-zone{position:relative;flex:1;min-height:0;background:var(--canvas);overflow:hidden}
.mapsvg{width:100%;height:100%;display:block}
.coord-strip{height:24px;flex:none;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--bg-header);border-top:1px solid var(--border-light);font-size:11px;color:var(--text-secondary);font-family:var(--mono)}
.ovl{position:absolute;background:rgba(251,248,241,.94);color:var(--text-primary);border:1px solid #46615c;border-radius:4px;padding:6px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.ovl.title{top:10px;left:50%;transform:translateX(-50%);font-weight:600;font-size:14px;white-space:nowrap}
.ovl.north{top:12px;right:14px;padding:4px 6px}
.ovl.scale{bottom:12px;left:14px;padding:6px 8px}
.ovl.legend{bottom:12px;right:14px;max-width:240px}
.leg-row{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:1.5px 0}
.lg-sw{width:13px;height:13px;border-radius:2px;border:1px solid rgba(0,0,0,.35);flex:none}
.sbar{display:flex;height:9px;width:168px;border:1px solid #333;margin-bottom:2px}
.sbar i{flex:1}
.sbar i:nth-child(odd){background:#141210}
.sbar i:nth-child(even){background:#fbf8f1}
.sbar-l{display:flex;justify-content:space-between;font-size:10px;font-family:var(--mono)}
/* ===== 编图工作台 ===== */
.mapwork{position:absolute;inset:var(--pad-page);display:flex;flex-direction:column;min-height:0}
.map-cmdbar{display:flex;align-items:stretch;background:var(--bg-header);border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;overflow-x:auto;flex:none}
.mc-group{display:flex;align-items:center;gap:2px;padding:4px 8px;border-right:1px solid var(--border);flex:none}
.mc-btn{display:flex;align-items:center;gap:5px;height:28px;padding:0 8px;border-radius:4px;font-size:12px;white-space:nowrap;cursor:pointer}
.mc-btn:hover{background:var(--bg-menu-hover)}
.mc-btn.on{background:var(--bg-nav-active);color:var(--primary);font-weight:600}
.mc-btn .ic{width:15px;height:15px}
.mc-name{font-size:10.5px;color:var(--text-secondary);align-self:center;padding:0 2px 0 6px;writing-mode:vertical-lr;letter-spacing:1px}
.map-mid{flex:1;display:flex;min-height:0;border:1px solid var(--border)}
.map-center-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.dockrail{width:var(--dockrail-w);flex:none;background:var(--bg-sidebar);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:6px;border-right:1px solid var(--border)}
.dockrail.rr{border-right:none;border-left:1px solid var(--border)}
.drbtn{width:27px;height:27px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);border:1px solid transparent}
.drbtn .ic{width:16px;height:16px}
.drbtn:hover{background:var(--bg-menu-hover)}
.drbtn.on{background:var(--bg-nav-active);color:var(--primary);border-color:var(--border-strong)}
.dock-col{width:255px;flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--bg-sidebar)}
.dock-col.rr{border-right:none;border-left:none}
.dock-col .panel{border:none;border-bottom:1px solid var(--border);border-radius:0;flex:1;min-height:110px}
.dock-col .panel:last-child{border-bottom:none}
.mstatus{height:var(--status-h);flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--bg-header);border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden}
.mstatus b{color:var(--text-primary);font-weight:600}
.wb{flex:none;border-top:1px solid var(--border);background:var(--bg-header)}
.wb-bar{display:flex;align-items:center;height:32px;padding:0 8px;gap:2px;border-bottom:1px solid var(--border-light)}
.wb-tab{height:24px;padding:0 12px;font-size:12px;display:flex;align-items:center;border-radius:4px;cursor:pointer;gap:6px}
.wb-tab:hover{background:var(--bg-menu-hover)}
.wb-tab.on{background:var(--bg-nav-active);font-weight:600;color:var(--primary)}
.wb-pane{height:188px;overflow:auto;padding:8px 12px;background:var(--bg-sidebar)}
.closable.closed .cbody{display:none}
/* ===== 井 / 地震 ===== */
.canvas-panel{display:flex;flex-direction:column;min-height:0;min-width:0}
.canvas-body{flex:1;min-height:0;position:relative;display:flex}
.canvas-body svg,.canvas-body canvas{flex:1;min-width:0}
canvas.seis{width:100%;height:100%;display:block}
.b2d{flex:none;border-top:1px solid var(--border-strong);background:var(--bg-sidebar)}
.b2d-h{height:30px;display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.b2d-body{display:flex;gap:12px;height:190px;padding:0 12px 12px}
.b2d.closed .b2d-body{display:none}
.grad-bar{width:18px;flex:none;border-radius:3px;background:linear-gradient(180deg,#c2410c,#e9e2d0 50%,#14454f);border:1px solid var(--border-strong)}
.joint3d{position:absolute;inset:var(--pad-page);display:flex;flex-direction:column;min-height:0}
.joint3d .lay-tri{position:static;flex:1;min-height:0;display:grid}
/* ===== 壳层 A ===== */
.topbar{height:var(--menu-h);flex:none;display:flex;align-items:center;gap:4px;background:var(--bg-header);border-bottom:1px solid var(--border-strong);padding:0 12px}
.brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding-right:14px;border-right:1px solid var(--border);margin-right:8px;color:var(--primary);white-space:nowrap}
.brand .ic{width:20px;height:20px}
.brand span{font-weight:500;font-size:12px;color:var(--text-secondary)}
.ribtabs{display:flex;gap:2px;height:100%;flex:none}
.ribtab{display:flex;align-items:center;padding:0 18px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-secondary);gap:6px}
.ribtab .ic{width:15px;height:15px}
.ribtab:hover{background:var(--bg-menu-hover)}
.ribtab.on{color:var(--primary);font-weight:600;border-bottom-color:var(--accent)}
.gsearch{display:flex;align-items:center;gap:8px;background:var(--bg-search);border:1px solid var(--border);border-radius:6px;padding:0 10px;height:30px;color:var(--text-secondary);flex:none}
.gsearch .ic{width:14px;height:14px}
.gsearch input{border:none;outline:none;background:transparent;font:inherit;font-size:12.5px;width:250px;color:var(--text-primary)}
.ribbon{height:92px;flex:none;display:flex;align-items:stretch;background:var(--bg-header);border-bottom:1px solid var(--border-strong);overflow-x:auto;overflow-y:hidden;padding:0 6px}
.rb-group{display:flex;flex-direction:column;padding:6px 12px 4px;border-right:1px solid var(--border);flex:none}
.rb-group:last-child{border-right:none}
.rb-items{display:flex;gap:6px;flex:1;align-items:stretch}
.rb-group.sm .rb-items{display:grid;grid-template-columns:repeat(2,auto);gap:3px 10px;align-content:center}
.rb-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:60px;padding:2px 8px;border-radius:var(--rbtn);font-size:12px;cursor:pointer;user-select:none;white-space:nowrap;text-align:center}
.rb-btn:hover{background:var(--bg-menu-hover)}
.rb-btn .ic{width:22px;height:22px}
.rb-btn.primary{background:var(--primary);color:var(--on-primary)}
.rb-btn.primary:hover{background:var(--primary-hover)}
.rb-btn.tglb.on{background:var(--bg-selection);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rb-group.sm .rb-btn{flex-direction:row;min-width:0;padding:2px 6px;font-size:12px;justify-content:flex-start}
.rb-group.sm .rb-btn .ic{width:15px;height:15px}
.rb-name{font-size:11px;color:var(--text-secondary);text-align:center;padding-top:4px;white-space:nowrap}
.rb-subgroup{background:var(--bg-search);border-right:2px solid var(--border-strong);margin-right:2px}
.rb-btn.subbtn{min-width:88px;font-weight:500}
.rb-btn.subbtn.on{background:var(--primary);color:var(--on-primary)}
.subpillbar{height:var(--menu-h);flex:none;display:flex;align-items:center;gap:8px;padding:0 var(--pad-page);background:var(--bg-body);border-bottom:1px solid var(--border)}
.subpill{height:27px;display:flex;align-items:center;gap:6px;padding:0 15px;border-radius:14px;border:1px solid var(--border-strong);background:var(--bg-header);font-size:12.5px;cursor:pointer}
.subpill .ic{width:14px;height:14px}
.subpill:hover{background:var(--bg-menu-hover)}
.subpill.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.subpill-lbl{font-size:11px;color:var(--text-secondary);margin-right:2px}
/* ===== 壳层 B ===== */
.rail{width:var(--rail-w);flex:none;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;gap:4px}
.railbrand{color:var(--text-rail-active);margin-bottom:10px}
.railbrand .ic{width:24px;height:24px}
.railbtn{width:52px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--text-rail);font-size:11px;border-radius:6px;cursor:pointer;flex:none}
.railbtn .ic{width:21px;height:21px}
.railbtn:hover{background:var(--rail-hover)}
.railbtn.on{background:var(--rail-active);color:var(--text-rail-active)}
.vtx{writing-mode:vertical-lr;letter-spacing:3px;line-height:1}
.railspace{flex:1}
.b-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.cmdrow{height:var(--menu-h);flex:none;display:flex;align-items:center;gap:8px;background:var(--bg-header);border-bottom:1px solid var(--border-strong);padding:0 12px}
.pmenu{position:absolute;top:46px;left:12px;background:var(--bg-sidebar);border:1px solid var(--border-strong);border-radius:6px;box-shadow:0 10px 28px rgba(20,18,16,.16);padding:5px;display:none;z-index:600;min-width:190px}
.pmenu.open{display:block}
.pmenu>div{padding:7px 12px;border-radius:4px;font-size:13px;cursor:pointer;display:flex;gap:9px;align-items:center}
.pmenu>div:hover{background:var(--bg-menu-hover)}
.pmenu>div .ic{width:15px;height:15px;color:var(--primary)}
/* ===== 壳层 C ===== */
.ctabs-row{height:44px;flex:none;background:var(--primary);display:flex;align-items:flex-end;padding:0 12px;gap:6px}
.cbrand{display:flex;align-items:center;gap:8px;color:var(--text-rail-active);font-weight:700;font-size:13.5px;padding:0 10px 10px 0;white-space:nowrap}
.cbrand .ic{width:19px;height:19px}
.ctabs{display:flex;gap:2px;flex:1;min-width:0;overflow:hidden}
.ctab{height:37px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:8px 8px 0 0;color:var(--text-rail);font-size:13px;cursor:pointer;white-space:nowrap}
.ctab .ic{width:15px;height:15px}
.ctab:hover{background:var(--rail-hover)}
.ctab.on{background:var(--bg-header);color:var(--text-primary);font-weight:600}
.ctab .x{opacity:.45;font-size:11px;padding:2px 3px;border-radius:3px}
.ctab .x:hover{opacity:1;background:rgba(0,0,0,.15)}
.csearch{display:flex;align-items:center;gap:7px;background:var(--rail-active);border-radius:6px;height:29px;padding:0 10px;color:var(--text-rail);margin-bottom:7px;flex:none}
.csearch .ic{width:13px;height:13px}
.csearch input{border:none;outline:none;background:transparent;color:var(--text-rail-active);font:inherit;font-size:12px;width:150px}
.ribbon.c{border-bottom-width:2px;background:var(--bg-header)}
.ribbon.c .rb-group{border-right:2px solid var(--border-strong);padding:7px 16px 5px}
.ribbon.c .rb-name{background:var(--bg-nav-active);border-radius:3px;padding:1px 10px;margin:3px auto 0;font-weight:600;color:var(--text-primary)}
.c-work{flex:1;display:flex;min-height:0;min-width:0}
.c-midcol{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.c-center{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:auto;padding:var(--pad-page)}
.c-subseg{padding:0 0 12px;display:flex;align-items:center;gap:12px}
.c-subseg .lbl{font-size:11px;color:var(--text-secondary)}
.dock{flex:none;display:flex;flex-direction:column;min-height:0;background:var(--bg-sidebar);border:1px solid var(--border);border-radius:var(--rcard);overflow:hidden;width:272px}
.dock-col-c{display:flex;flex-direction:column;gap:12px;width:272px;flex:none;min-height:0;overflow:hidden}
.dock-col-c .dock{flex:1;min-height:130px}
.dock-l{border-right:none;border-top-left-radius:0;border-bottom-left-radius:0;border-left:none}
.dock-bottom{width:auto;height:212px;border-radius:var(--rcard) var(--rcard) 0 0;border-bottom:none;margin-top:12px}
.statusbar{height:var(--status-h);flex:none;display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--bg-header);border-top:1px solid var(--border);font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden}
.statusbar b{color:var(--text-primary)}
.statusbar .sb-r{margin-left:auto;display:flex;gap:18px}

.viz-tabs .tab{padding:0 16px}

.app.compact .dock{width:240px}

#variantBar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;display:flex;align-items:stretch;background:#101014;border:2px dashed #ffb020;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.5);font-family:var(--mono);overflow:hidden}
#variantBar .vtag{background:#ffb020;color:#101014;font-weight:700;font-size:10px;padding:0 9px;display:flex;align-items:center;letter-spacing:1px}
#variantBar button{all:unset;cursor:pointer;color:#ffd166;font-size:15px;padding:9px 15px;line-height:1}
#variantBar button:hover{background:#26262e}
#vLabel{color:#f5f2e8;font-size:12px;padding:9px 12px;min-width:300px;text-align:center;letter-spacing:.5px;align-self:center}
#vHint{color:#8a8578;font-size:10px;padding:9px 10px 9px 0;align-self:center}
#toast{position:fixed;right:18px;bottom:72px;z-index:9998;background:#141210;color:#f5f2e8;padding:9px 14px;border-radius:6px;border-left:3px solid var(--accent);font-size:12.5px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:360px}
#toast.show{opacity:1;transform:none}

/* ================= 地震剖面 Canvas 绘制 ================= */
function drawWellCol(ctx,x,label,hor){
  var h=ctx.canvas.height;
  ctx.strokeStyle='rgba(242,247,245,0.9)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(x,16);ctx.lineTo(x,h-10);ctx.stroke();
  ctx.fillStyle='#f2b53a';
  for(var i=0;i<hor.length;i+=2){var yy=hor[i].y0+hor[i].dip*x;ctx.beginPath();ctx.moveTo(x-5,yy);ctx.lineTo(x+5,yy);ctx.lineTo(x,yy+7);ctx.closePath();ctx.fill();}
  ctx.fillStyle='#f2f7f5';ctx.font='bold 11px sans-serif';ctx.fillText(label,x+6,26);
}
function paintSeismic(cv,seed,o){
  o=o||{};
  if(!cv||!cv.getContext)return;
  var w=cv.clientWidth||640,h=cv.clientHeight||380;
  if(cv.width!==w)cv.width=w;
  if(cv.height!==h)cv.height=h;
  var ctx=cv.getContext('2d');
  var rnd=mulberry32(seed||7);
  var hor=[],i,k;
  for(i=0;i<9;i++)hor.push({y0:18+i*(h-36)/9+rnd()*8,dip:(rnd()-0.5)*0.10,amp:0.45+rnd()*0.5});
  var mode=o.mode||'amp';
  var NEG=[20,69,79],ZERO=[233,226,208],POS=[194,65,12];
  if(mode==='wig'){
    ctx.fillStyle='#101b18';ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(233,226,208,0.72)';ctx.lineWidth=1;
    for(var x2=8;x2<w;x2+=13){
      ctx.beginPath();
      for(var y2=0;y2<h;y2+=3){
        var a2=0;
        for(k=0;k<hor.length;k++){var H3=hor[k],d2=y2-(H3.y0+H3.dip*x2);a2+=Math.cos(d2*0.55)*Math.exp(-Math.abs(d2)/9)*H3.amp;}
        a2+=(rnd()-0.5)*0.2;
        var px=x2+a2*9;
        if(y2===0)ctx.moveTo(px,y2);else ctx.lineTo(px,y2);
      }
      ctx.stroke();
    }
  }else{
    ctx.fillStyle='#0d1514';ctx.fillRect(0,0,w,h);
    for(var x=0;x<w;x+=2){
      for(var y=0;y<h;y+=2){
        var a=0;
        for(k=0;k<hor.length;k++){var H2=hor[k],d=y-(H2.y0+H2.dip*x);a+=Math.cos(d*0.55)*Math.exp(-Math.abs(d)/9)*H2.amp;}
        a+=(rnd()-0.5)*0.22;
        if(a>1)a=1;if(a<-1)a=-1;
        var c;
        if(mode==='va'&&a<=0)c=[16,27,24];
        else c=a<0?mix(ZERO,NEG,-a):mix(ZERO,POS,a);
        ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
        ctx.fillRect(x,y,2,2);
      }
    }
  }
  ctx.strokeStyle='rgba(255,255,255,0.08)';
  ctx.fillStyle='rgba(238,244,241,0.4)';
  ctx.font='9px monospace';
  for(var ty=42;ty<h;ty+=62){
    ctx.beginPath();ctx.moveTo(0,ty);ctx.lineTo(w,ty);ctx.stroke();
    ctx.fillText((ty*8)+' ms',4,ty-3);
  }
  if(o.wells){drawWellCol(ctx,w*0.24,'W12',hor);drawWellCol(ctx,w*0.66,'W28',hor);}
  if(o.tie){
    var wxs=[w*0.24,w*0.66];
    ctx.strokeStyle='#f2b53a';ctx.setLineDash([4,3]);
    for(i=0;i<wxs.length;i++){
      for(k=1;k<hor.length;k+=3){
        var yy2=hor[k].y0+hor[k].dip*wxs[i];
        ctx.beginPath();ctx.moveTo(wxs[i]-8,yy2);ctx.lineTo(wxs[i]-52,yy2);ctx.stroke();
        ctx.beginPath();ctx.arc(wxs[i]-56,yy2,3,0,6.3);ctx.stroke();
      }
    }
    ctx.setLineDash([]);
    ctx.fillStyle='#f2b53a';ctx.font='bold 10px sans-serif';
    ctx.fillText('Auto-Tie',12,h-14);
  }
}

/* ================= 渲染 & 导航 ================= */
function render(){
  var app=document.getElementById('app');
  /* CSS 类名区分大小写：变体代号须转小写（app-A 无法命中 .app-a） */
  app.className='app app-'+state.variant.toLowerCase()+(state.dense?' compact':'');
  var m=mod();
  app.innerHTML=state.variant==='A'?shellA():(state.variant==='B'?shellB():shellC());
  afterMount();
  var lb=document.getElementById('vLabel');
  if(lb)lb.textContent='变体 '+state.variant+' · '+VARIANTS[state.variant]+'  ['+({A:1,B:2,C:3})[state.variant]+'/3]';
}
function nav(page,sub){
  if(page&&PAGES.some(function(p){return p.id===page;}))state.page=page;
  var subs=SUBS[state.page]||[];
  if(subs.length){
    if(sub&&subs.some(function(s){return s.id===sub;}))state.sub=sub;
    else if(!subs.some(function(s){return s.id===state.sub;}))state.sub=subs[0].id;
  }else state.sub=null;
  render();
}
function switchVariant(dir){
  var order=['A','B','C'],i=order.indexOf(state.variant);
  i=(i+dir+order.length)%order.length;
  state.variant=order[i];
  try{
    var sp=new URLSearchParams(location.search);
    sp.set('variant',state.variant);
    history.replaceState(null,'',location.pathname+'?'+sp.toString());
  }catch(e){}
  render();
  toast('原型变体 → '+state.variant+' · '+VARIANTS[state.variant]);
}
function update3D(){
  var wrap=document.getElementById('v3dWrap');
  if(!wrap)return;
  function g(id){return document.getElementById(id);}
  function ck(id){var e2=g(id);return e2?e2.classList.contains('on'):true;}
  var il=g('sl-il'),xl=g('sl-xl'),t=g('sl-t');
  wrap.innerHTML=svg3DView({il:il?+il.value:1200,xl:xl?+xl.value:800,tm:t?+t.value:2400,fl:{wells:ck('tree-wells'),vol:ck('tree-vol'),slices:ck('tree-slices')}});
  ['sl-il','sl-xl','sl-t'].forEach(function(id){var l=g(id+'Val'),s=g(id);if(l&&s)l.textContent=s.value+(id==='sl-t'?' ms':'');});
}
function afterMount(){
  var cvs=document.querySelectorAll('canvas[data-seis]');
  for(var i=0;i<cvs.length;i++){
    var cv=cvs[i];
    paintSeismic(cv,parseInt(cv.getAttribute('data-seed'),10)||7,{mode:cv.getAttribute('data-mode')||'amp',tie:cv.getAttribute('data-tie')==='1',wells:cv.getAttribute('data-wells')!=='0'});
  }
}

document.addEventListener('click',function(e){
  var b=e.target&&e.target.closest?e.target.closest('[data-act]'):null;
  var pm=document.getElementById('projMenu');
  if(pm&&!e.target.closest('#projMenu')&&!(b&&b.getAttribute('data-act')==='menu'))pm.classList.remove('open');
  if(!b)return;
  var act=(b.getAttribute('data-act')||'').split(' ')[0];
  switch(act){
    case 'nav':nav(b.getAttribute('data-page'),b.getAttribute('data-sub'));break;
    case 'variant':switchVariant(parseInt(b.getAttribute('data-dir'),10));break;
    case 'toggle':{
      b.classList.toggle('on');
      var on=b.classList.contains('on');
      toast('【原型】「'+(b.getAttribute('data-label')||'')+'」'+(on?'已开启':'已关闭'));
      var rp=b.getAttribute('data-repaint');
      if(rp){var cv=document.getElementById(rp);if(cv){cv.setAttribute('data-tie',on?'1':'0');paintSeismic(cv,parseInt(cv.getAttribute('data-seed'),10)||7,{mode:cv.getAttribute('data-mode'),tie:on,wells:cv.getAttribute('data-wells')!=='0'});}}
      break;}
    case 'toast':toastMsg(b);break;
    case 'tab':{
      var scope=b.closest('.tabbed')||b.closest('.wb')||document.querySelector('.wb');
      if(scope){
        var tabs=scope.querySelectorAll('.tab,.wb-tab');
        for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('on',tabs[i]===b);
        var panes=scope.querySelectorAll('.pane');
        for(var j=0;j<panes.length;j++)panes[j].classList.toggle('on',panes[j].getAttribute('data-pane')===b.getAttribute('data-tab'));
      }
      break;}
    case 'expand':{var tn=b.closest('.tnode');if(tn)tn.classList.toggle('open');break;}
    case 'collapse':{var tg=document.querySelector(b.getAttribute('data-target'));if(tg)tg.classList.toggle('closed');break;}
    case 'check':{
      b.classList.toggle('on');
      var cks=b.querySelectorAll('.ck');
      for(var k=0;k<cks.length;k++)cks[k].classList.toggle('on',b.classList.contains('on'));
      if(b.classList.contains('ck'))b.classList.add('on')&&0;
      if(b.getAttribute('data-bind')==='3d')update3D();
      break;}
    case 'selrow':{
      var p2=b.parentElement;
      if(p2){var ons=p2.querySelectorAll('.trow.on,tr.sel');for(var q=0;q<ons.length;q++){ons[q].classList.remove('on');ons[q].classList.remove('sel');}}
      b.classList.add('on');
      toastMsg(b);
      break;}
    case 'layer':{
      b.classList.toggle('on');
      var shown=b.classList.contains('on');
      var wrap=b.closest('.coord-zone');
      var el=wrap?wrap.querySelector('[data-ly="'+b.getAttribute('data-layer')+'"]'):null;
      if(el)el.style.display=shown?'':'none';
      toast('【原型】图层「'+(b.getAttribute('data-layer')||'')+'」'+(shown?'显示':'隐藏'));
      break;}
    case 'ely':{
      b.classList.toggle('on');
      var shown2=b.classList.contains('on');
      var el2=document.querySelector('#app [data-ly="'+b.getAttribute('data-layer')+'"]');
      if(el2)el2.style.display=shown2?'':'none';
      toast('【原型】图面要素「'+(b.getAttribute('data-label')||'')+'」'+(shown2?'显示':'隐藏'));
      break;}
    case 'dockbtn':{
      var t2=document.querySelector(b.getAttribute('data-target'));
      var show2=t2&&t2.style.display==='none';
      if(t2)t2.style.display=show2?'':'none';
      b.classList.toggle('on',!!show2);
      break;}
    case 'cdock':{
      var st=dockState[dockKey()];
      if(st){st[b.getAttribute('data-side')][parseInt(b.getAttribute('data-idx'),10)]=!st[b.getAttribute('data-side')][parseInt(b.getAttribute('data-idx'),10)];render();}
      break;}
    case 'cbottom':{
      var st3=dockState[dockKey()];
      if(st3){st3.bottom=!st3.bottom;render();}
      break;}
    case 'menu':{var pmenu=document.getElementById('projMenu');if(pmenu)pmenu.classList.toggle('open');break;}
    case 'density':{
      state.dense=!state.dense;
      var app=document.querySelector('.app');
      if(app)app.classList.toggle('compact',state.dense);
      b.classList.toggle('on',state.dense);
      toast('【原型】界面密度已切换');
      break;}
    case 'segto':{
      var seg=b.parentElement;
      if(seg){var items=seg.querySelectorAll('i');for(var s=0;s<items.length;s++)items[s].classList.toggle('on',items[s]===b);}
      toastMsg(b);
      break;}
    case 'glmode':{
      var mode=b.getAttribute('data-mode');
      var all=document.querySelectorAll('[data-act="glmode"]');
      for(var g2=0;g2<all.length;g2++)all[g2].classList.toggle('on',all[g2].getAttribute('data-mode')===mode);
      var cv2=document.getElementById('glCanvas');
      if(cv2){cv2.setAttribute('data-mode',mode);paintSeismic(cv2,parseInt(cv2.getAttribute('data-seed'),10)||7,{mode:mode,tie:cv2.getAttribute('data-tie')==='1',wells:cv2.getAttribute('data-wells')!=='0'});}
      toast('【原型】显示模式 → '+b.textContent.trim());
      break;}
    case 'sw':{b.classList.toggle('on');toast('【原型】「'+(b.getAttribute('data-label')||'')+'」'+(b.classList.contains('on')?'已开启':'已关闭'));break;}
    case 'noclose':toast('原型：页面标签不可关闭');break;
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  var bind=el.getAttribute&&el.getAttribute('data-bind');
  if(!bind)return;
  if(bind==='corrgap'){
    var w=document.getElementById('corrWrap');
    if(w)w.innerHTML=svgCorrelation(parseInt(el.value,10));
    var l=document.getElementById('corrGapVal');
    if(l)l.textContent=el.value+' m';
  }else if(bind==='slice'){update3D();}
});
document.addEventListener('mousemove',function(e){
  if(!e.target||!e.target.closest)return;
  var z=e.target.closest('[data-coordzone]');
  if(!z)return;
  var out=document.getElementById(z.getAttribute('data-coordzone'));
  if(!out)return;
  var r=z.getBoundingClientRect();
  var fx=(e.clientX-r.left)/Math.max(1,r.width),fy=(e.clientY-r.top)/Math.max(1,r.height);
  out.textContent=fmtLL(fx,fy)+' · '+fmtMeter(fx,fy);
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t&&t.id==='gsearch'&&e.key==='Enter'){toast('【原型】全局搜索「'+t.value+'」');return;}
  if(t&&(t.isContentEditable||t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return;
  if(e.key==='ArrowLeft'){switchVariant(-1);e.preventDefault();}
  else if(e.key==='ArrowRight'){switchVariant(1);e.preventDefault();}
});
/* ================= 初始化 ================= */
(function(){
  var v='A';
  try{v=(new URLSearchParams(location.search)).get('variant')||'A';}catch(e2){}
  v=String(v).toUpperCase();
  if(!VARIANTS[v])v='A';
  state.variant=v;
  render();
})();
</script>
</body>
</html>
