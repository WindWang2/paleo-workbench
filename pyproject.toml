[project]
name = "paleo-workbench"
version = "0.2.17a0"
description = "Paleogeographic map compilation desktop workbench"
license = {file = "LICENSE"}
# Support CPython 3.12 (CI baseline) and 3.13 (common host / developer runtime).
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6>=6.6",
    "pydantic>=2.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "lasio>=0.14",
    "markdown>=3.5",
    "rasterio>=1.3",
    # Bindings must match the system libgdal at runtime. CI pins via gdal-config
    # (see .github/workflows/ci.yml). Developers: pip install gdal==$(gdal-config --version).
    "gdal>=3.6",
    "pillow>=10.0",
    # Mapping topology merge/split (map_edit_api) requires shapely.
    "shapely>=2.0",
    # geo-viz-engine is consumed as a git submodule at ./geo-viz-engine.
    # Its subpackages are installed editable (see requirements-geoviz.txt) so each
    # subpackage pulls its own heavy deps (scipy, segyio, pyqtgraph, PyOpenGL,
    # matplotlib). They are NOT listed here as PEP 508 path deps because
    # standard pip does not expand ${PROJECT_ROOT}-style variables; list-install
    # order also matters (leaf packages first).
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.3.1",
    # tests/test_wheel_assets.py builds the wheel in-process via the PEP 517
    # backend hook; modern runner venvs no longer ship setuptools implicitly.
    "setuptools>=69",
    # The marching-cubes fallback contract tests (#830,
    # tests/test_issues_823_828_830_833.py) drive the pure-Python fallback
    # with the C++ extension disabled; that path implements the isovalue
    # boundary contract via scikit-image when no native module is available.
    # Without it CI fails with "No module named 'skimage'" (#859 follow-up).
    "scikit-image>=0.22",
]
native = [
    "pybind11>=2.12",
]
# QGIS production renderer (paleo_workbench.mapping.map_render_backend with
# prefer_qgis=True) is OPT-IN: it builds the vendored QGIS core under
# native/qgis_render_bridge and is NOT covered by the main CI gate (which
# tests the fallback renderer — see README "QGIS renderer (opt-in)"). A
# dedicated fail-closed workflow (.github/workflows/qgis-renderer.yml)
# builds it on qgis-path changes; the main gate stays fallback-only.
# Requires Qt6 development headers (qt6-base-dev etc.) and cmake/ninja.
# Build: PALEO_WITH_QGIS_RENDERER=1 python -m pip install -e native/qgis_render_bridge
qgis-renderer = [
    "pybind11>=2.12",
    "ninja>=1.11",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
# Installed-state entry points (packaging #440). `python -m paleo_workbench`
# works via paleo_workbench/__main__.py; both enter paleo_workbench.main.main()
# and exit with its status (SystemExit(2) with install guidance when geoviz is
# unavailable). WellPlot Desktop (well-log-engine/apps/wellplot-desktop) is a
# separate product not packaged from this tree.
paleo-workbench = "paleo_workbench.main:main"

[tool.setuptools.packages.find]
include = ["paleo_workbench*"]

# Non-.py package assets are loaded from the filesystem at runtime
# (paleo_workbench/ui/icon_rail.py, menu_bar.py, mapping docs, vendored
# ATTRIBUTION.md) — without this, wheels silently ship them missing and the
# UI degrades to plain-text navigation (packaging #439). Keep in sync with
# tests/test_wheel_assets.py.
[tool.setuptools.package-data]
paleo_workbench = [
    "ui/assets/icons/*.svg",
    "ui/pages/prototypes/*.html",
    "mapping/*.md",
    "_vendored/haiyou_constrained_idw/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "slow: opt-in real-data or graphics tests; skip in fast CI with -m 'not slow'",
    "timeout: per-test timeout (requires pytest-timeout plugin)",
]
pythonpath = [
    ".",
    # NOTE: the bare geo-viz-engine root is deliberately NOT on the path:
    # it hosts committed cpython-313 .so binaries that shadow the freshly
    # built extensions (packaging #435). `geoviz` itself resolves from the
    # editable installs in requirements-geoviz.txt.
    "geo-viz-engine/packages/geoviz_common",
    "geo-viz-engine/packages/geoviz_paleo_map",
    "geo-viz-engine/packages/geoviz_plots",
    "geo-viz-engine/packages/geoviz_seismic",
    "geo-viz-engine/packages/geoviz_well_log",
    "geo-viz-engine/packages/geoviz_cross_well",
    "geo-viz-engine/packages/geoviz_well_tie",
    "geo-viz-engine/packages/geoviz_well_seismic_3d",
    "geo-viz-engine/packages/geoviz_map",
]
